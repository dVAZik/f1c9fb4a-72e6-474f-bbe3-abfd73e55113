<!DOCTYPE html>
<html>
<head>
    <title>Онлайн Дурак - Главная</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        .lobby-list {
            display: grid;
            gap: 10px;
        }
        
        .lobby-card {
            background: var(--bg-tertiary);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .lobby-card:hover {
            border-color: var(--text-accent);
            transform: translateY(-2px);
        }
        
        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .lobby-name {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .lobby-players {
            color: var(--text-secondary);
            font-size: 0.9em;
        }
        
        .lobby-settings {
            font-size: 0.8em;
            color: var(--text-secondary);
        }
        
        .create-lobby-form {
            display: grid;
            gap: 12px;
        }
        
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            z-index: 1000;
        }
        
        .connection-status.connected {
            background: var(--positive);
            color: black;
        }
        
        .connection-status.disconnected {
            background: var(--negative);
            color: white;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-size: 1.2em;
        }
    </style>
</head>
<body class="background-main background-pattern">
    <div class="connection-status disconnected" id="connectionStatus">
        🔴 Отключено
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        ⏳ Подключение к серверу...
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">🎮 ОНЛАЙН ДУРАК</div>
            <div class="subtitle">Классическая карточная игра с друзьями и ботами</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="onlineCount">0</div>
                <div class="stat-label">Онлайн</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="gamesCount">0</div>
                <div class="stat-label">Игр</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="winRate">0%</div>
                <div class="stat-label">Побед</div>
            </div>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn primary" onclick="showCreateLobby()">
                🎯 Создать лобби
            </button>
            <button class="nav-btn" onclick="showLobbyList()">
                📋 Список лобби
            </button>
            <button class="nav-btn secondary" onclick="quickPlay()">
                ⚡ Быстрая игра
            </button>
        </div>
        
        <!-- Форма создания лобби -->
        <div class="section" id="createLobbySection" style="display: none;">
            <div class="section-title">Создание лобби</div>
            <div class="create-lobby-form">
                <div class="input-group">
                    <label class="input-label">Название лобби</label>
                    <input type="text" class="input-field" id="lobbyName" placeholder="Моя игра" value="Моя игра">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Тип игры</label>
                    <select class="select-field" id="gameType">
                        <option value="throw">Подкидной дурак</option>
                        <option value="transfer">Переводной дурак</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Количество игроков</label>
                    <select class="select-field" id="maxPlayers">
                        <option value="2">2 игрока</option>
                        <option value="3">3 игрока</option>
                        <option value="4" selected>4 игрока</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Уровень сложности ботов</label>
                    <select class="select-field" id="botDifficulty">
                        <option value="easy">Легкий</option>
                        <option value="medium" selected>Средний</option>
                        <option value="hard">Сложный</option>
                    </select>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" class="checkbox" id="isPublic" checked>
                    <label class="input-label">Публичное лобби</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" class="checkbox" id="enableChat">
                    <label class="input-label">Разрешить чат</label>
                </div>
                
                <button class="nav-btn primary" onclick="createLobby()">Создать игру</button>
                <button class="nav-btn" onclick="hideCreateLobby()">Отмена</button>
            </div>
        </div>
        
        <!-- Список лобби -->
        <div class="section" id="lobbyListSection" style="display: none;">
            <div class="section-title">Доступные лобби</div>
            <button class="nav-btn" onclick="refreshLobbies()" style="margin-bottom: 15px;">
                🔄 Обновить список
            </button>
            <div class="lobby-list" id="lobbyList">
                <div class="lobby-card">
                    <div class="lobby-header">
                        <div class="lobby-name">Загрузка...</div>
                        <div class="lobby-players">-/-</div>
                    </div>
                    <div class="lobby-settings">Подождите...</div>
                </div>
            </div>
            <button class="nav-btn" onclick="hideLobbyList()">Назад</button>
        </div>
        
        <!-- Быстрая игра -->
        <div class="section" id="quickPlaySection" style="display: none;">
            <div class="section-title">Быстрая игра</div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="quickPlayWithBots()">
                    🤖 Игра с ботами
                </button>
                <button class="nav-btn" onclick="findRandomGame()">
                    🎮 Найти игру
                </button>
            </div>
            <button class="nav-btn" onclick="hideQuickPlay()">Назад</button>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
